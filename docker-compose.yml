version: '3'
services:
  reverse_proxy: 
    build: nginx/.
    container_name: production_nginx
    ports:
      - 80:80
      - 443:443
    restart: always
    networks:
      - default

  app:
    build: SpeurzoekersApp/.
    restart: always
    networks:
      - default
    
  service:
    build: SpeurzoekersService/.
    restart: always
    networks:
      - default  

networks:
  default: