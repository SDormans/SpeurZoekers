<img src="assets/photo/Logo in actie without neg.space.png" alt="logo" id="logo">

<div class="honeycomb">
  <div class="hexagon">
    <div class="hex-content">
      <h3>Wachtwoord reset</h3>
      <div class="underline"></div>
      <form class="example-form" [formGroup]="resetForm" (ngSubmit)="onSubmit()">
        <div class="form-group required">
          <input class="imput-text" matInput placeholder="e-mail" formControlName="username" name="username" required
            autofocus><br>
          <label *ngIf="
              submitted &&
              resetForm.get('username').hasError('required')
            "><small>Veld is verplicht</small></label>
        </div>
        <div formGroupName="passwords">
          <div class="form-group required">
            <input type="password" class="form-control" formControlName="password" placeholder="nieuw wachtwoord"
              required /><br />
          </div>

          <label *ngIf="
              resetForm.get('passwords.password').touched &&
              resetForm.get('passwords.password').hasError('pattern')
            "><small>Je wachtwoord moet minimaal 6 tekens bevatten, waarvan 1 hoofdletter, 1 kleine letter en 1
              speciaal teken.
            </small></label>
          <label *ngIf="
            submitted &&
            resetForm.get('passwords.password').hasError('required')
          "><small>Veld is verplicht</small></label>
          <div class="form-group required">
            <input type="password" class="form-control" formControlName="confirmPassword"
              placeholder="herhaal wachtwoord" required /><br />
          </div>

          <label *ngIf="
              resetForm.get('passwords.confirmPassword').touched &&
              resetForm.get('passwords.confirmPassword').errors.passwordMismatch
            "><small>Wachtwoord komt niet overeen</small></label>
          <label *ngIf="
            submitted &&
            resetForm.get('passwords.confirmPassword').hasError('required')
          "><small>Veld is verplicht</small></label>
        </div>

        <div class="form-group">
          <button class="login-button" mat-raised-button class="login-button" type="submit">submit</button>
        </div>

      </form>

    </div>
  </div>
</div>
