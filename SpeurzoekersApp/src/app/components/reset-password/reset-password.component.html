<img src="assets/photo/Logo in actie without neg.space.png" alt="logo" id="logo">

<div class="honeycomb">
  <div class="hexagon">
    <div class="hex-content">
      <h3>Herstel mijn<br> wachtwoord</h3>
      <div class="underline"></div>
      <form class="example-form" [formGroup]="resetRequestForm" (ngSubmit)="onSubmit()">
        <div class="form-group required">
          <input class="imput-text" matInput placeholder="e-mail" formControlName="username" name="username" required
            autofocus><br>
            <label
            *ngIf="
              submitted &&
              resetRequestForm.get('username').hasError('required')
            "
            ><small>Veld is verplicht</small></label
          >
          <label
            *ngIf="
              submitted &&
              resetRequestForm.get('username').hasError('email')
            "
            ><small>Ongeldig e-mailadres</small></label
          >
        </div>
        <div class="form-group">
          <button mat-raised-button class="send-button" type="submit">Verstuur</button>
        </div>
      </form>
      <div class="resetText">
        <p>Vul je e-mailadres hier in. Wij sturen je een e-mail om een nieuw wachtwoord in te stellen. Kijk ook even in je spamfolder.</p>
      </div>
      <div class="login">
        <a routerLink="/login">
          <h3 class="under">Inloggen</h3>
        </a>
        <div class="underline"></div>
      </div>
      <div class="profile">
        <a routerLink="/register">
          <h3 class="under">Maak een profiel</h3>
        </a>
        <div class="underline"></div>
      </div>
    </div>
  </div>
</div>
