<div class="background-canvas">
  <div class="honeycomb-container">
    <div class="honeycomb">
      <div class="right-column">
        <div class="hexagon water">
          <img class="hexagon-image" src="assets/photo/biotopes-photos/Water klein.jpg"/>
          <button
            routerLink="/collection"
            [queryParams]="{ biotope: 16 }"
            mat-raised-button
            class="hexagon-button"
          >
            water
          </button>
        </div>
      </div>

      <div class="right-column">
        <div class="hexagon stad">
          <img class="hexagon-image" src="assets/photo/biotopes-photos/Stad klein.jpg"/>
          <button
            routerLink="/collection"
            [queryParams]="{ biotope: 1 }"
            mat-raised-button
            class="hexagon-button"
          >
            stad
          </button>
        </div>
      </div>

      <div class="right-column">
        <div class="hexagon park">
          <img class="hexagon-image" src="assets/photo/biotopes-photos/Park klein.jpg"/>
          <button
            routerLink="/collection"
            [queryParams]="{ biotope: 2 }"
            mat-raised-button
            class="hexagon-button"
          >
            park
          </button>
        </div>
      </div>

      <div class="left-column">
        <div class="hexagon bos">
          <img class="hexagon-image" src="assets/photo/biotopes-photos/Bos klein.jpg"/>
          <button
            routerLink="/collection"
            [queryParams]="{ biotope: 4 }"

          </button>
        </div>

      <div class="left-column">

            [queryParams]="{ biotope: 8 }"
            mat-raised-button
            class="hexagon-button"
          >
            weide
          </button>
        </div>
      </div>

      <div class="left-column">
        <div class="hexagon kust">
          <img class="hexagon-image" src="assets/photo/biotopes-photos/Kust klein.jpg"/>
          <button
            routerLink="/collection"
            [queryParams]="{ biotope: 32 }"
            mat-raised-button
            class="hexagon-button"
          >
            zee en strand
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
